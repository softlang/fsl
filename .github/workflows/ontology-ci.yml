name: Ontology CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pyshacl rdflib

      - name: Validate valid ontology
        run: |
          python -m pyshacl \
            -s validation/ClassDeclarationsMustHaveCommentShape.ttl \
            -e ontologies/tbox.ttl \
            test_pass.ttl

      - name: Validate invalid ontology
        run: |
          if python -m pyshacl \
            -s validation/ClassDeclarationsMustHaveCommentShape.ttl \
            -e ontologies/tbox.ttl \
            test_fail.ttl; then
              echo "ERROR: Invalid ontology unexpectedly passed validation"
              exit 1
          else
              echo "Expected SHACL violation detected"
          fi
